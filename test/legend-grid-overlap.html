<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script src="lib/simpleRequire.js"></script>
        <script src="lib/config.js"></script>
        <script src="lib/jquery.min.js"></script>
        <script src="lib/facePrint.js"></script>
        <script src="lib/testHelper.js"></script>
        <link rel="stylesheet" href="lib/reset.css">
    </head>
    <body>
        <style>
            .chart {
                width: 520px;
                height: 320px;
            }
        </style>

        <h1>Plain multi-row legend should not overlap the grid or axis labels</h1>
        <div class="chart" id="auto"></div>

        <h1>outerBoundsMode: 'none' preserves explicit overlap behavior</h1>
        <div class="chart" id="none"></div>

        <script>
            require(['echarts'], function (echarts) {
                var names = [
                    'North Atlantic',
                    'South Atlantic',
                    'North Pacific',
                    'South Pacific',
                    'Indian Ocean',
                    'Mediterranean',
                    'Baltic Sea',
                    'Caribbean Sea',
                    'Arctic Ocean',
                    'Southern Ocean',
                    'Gulf of Mexico',
                    'Bering Sea'
                ];

                function makeOption(outerBoundsMode) {
                    return {
                        animation: false,
                        legend: {
                            bottom: 0,
                            data: names
                        },
                        grid: {
                            left: 36,
                            top: 20,
                            right: 18,
                            bottom: 20,
                            containLabel: true,
                            outerBoundsMode: outerBoundsMode
                        },
                        xAxis: {
                            type: 'category',
                            data: ['A', 'B', 'C', 'D']
                        },
                        yAxis: {
                            type: 'value'
                        },
                        series: names.map(function (name, idx) {
                            return {
                                name: name,
                                type: 'line',
                                showSymbol: false,
                                data: [idx + 1, idx + 2, idx + 3, idx + 2]
                            };
                        })
                    };
                }

                testHelper.createChart(echarts, 'auto', makeOption('auto'));
                testHelper.createChart(echarts, 'none', makeOption('none'));
            });
        </script>
    </body>
</html>
